<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Roster Dashboard</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 30px; }
        h1 { text-align: center; border-bottom: 1px solid #30363d; padding-bottom: 20px; color: #58a6ff; }
        
        .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; margin-top: 30px; }
        
        .team-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        
        .team-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 10px; margin-bottom: 15px; }
        .team-header h2 { margin: 0; color: #58a6ff; font-size: 1.2em; }
        
        .badge { background: #238636; color: #fff; padding: 5px 10px; border-radius: 20px; font-size: 0.8em; font-weight: bold; }
        .badge.poor { background: #da3633; }
        
        .stats-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 0.9em; color: #8b949e; }
        
        .roster-pre {
            background-color: #0d1117;
            padding: 15px;
            border-radius: 6px;
            overflow-y: auto;
            max-height: 250px;
            font-size: 0.85em;
            color: #a5d6ff;
            border: 1px solid #30363d;
        }
    </style>
</head>
<body>

    <h1>🌐 Global Roster & Elo Tracker</h1>

    <div class="team-grid" id="teamGrid">
        </div>

    <script>
        async function loadDashboard() {
            try {
                const response = await fetch('tournament_state.json');
                const data = await response.json();
                
                const grid = document.getElementById('teamGrid');
                
                // Sort by Elo descending for the display
                data.leaderboard.sort((a, b) => b.Elo - a.Elo);

                data.leaderboard.forEach(player => {
                    const eloClass = player.Elo < 1000 ? 'badge poor' : 'badge';
                    const rawTeamData = data.teams[player.Nome] || "No data available.";
                    
                    const card = document.createElement('div');
                    card.className = 'team-card';
                    card.innerHTML = `
                        <div class="team-header">
                            <h2>${player.Nome}</h2>
                            <span class="${eloClass}">Elo: ${player.Elo}</span>
                        </div>
                        <div class="stats-row">
                            <span>Win Rate: ${player['Taxa de Vitória (%)']}%</span>
                            <span>Matches: ${player['Séries Jogadas']}</span>
                        </div>
                        <pre class="roster-pre">${rawTeamData.trim()}</pre>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error("Error loading JSON:", error);
                document.getElementById('teamGrid').innerHTML = `<p style="color:red; text-align:center;">Failed to load data. Make sure you are running a local web server.</p>`;
            }
        }

        loadDashboard();
    </script>
</body>
</html>
